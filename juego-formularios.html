<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formularios HTML: el juego</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#1f2437; --muted:#5d6580; --line:#dfe3ef;
  --brand:#5b4bdb; --brand-d:#4337b3; --brand-l:#ece9ff;
  --ok:#1f9d57; --ok-l:#e2f6ea; --ko:#d9334a; --ko-l:#fde8eb; --warn:#f2a900; --warn-l:#fff4d6;
  --code-bg:#1e2236; --code-ink:#e8ecff; --code-tag:#ff9ecb; --code-attr:#ffd479; --code-str:#9be3a4; --code-com:#8a93b8;
  --shadow:0 6px 22px rgba(30,34,70,.10);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12141f; --card:#1b1e2e; --ink:#eef0fa; --muted:#a3abc9; --line:#2f3450;
    --brand:#8a7dff; --brand-d:#a79dff; --brand-l:#262449;
    --ok:#4cd68a; --ok-l:#183a2a; --ko:#ff6b81; --ko-l:#40202a; --warn:#ffc83d; --warn-l:#3b3216;
    --code-bg:#0f1120; --shadow:0 6px 22px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--brand-l);color:var(--brand-d);padding:.08em .38em;border-radius:6px;font-size:.92em}
header.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.04)}
.top-in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-weight:800;font-size:1.05rem;display:flex;align-items:center;gap:8px;margin-right:auto;cursor:pointer;background:none;border:0;padding:0}
.logo span.badge{background:var(--brand);color:#fff;border-radius:10px;padding:2px 8px;font-family:ui-monospace,Menlo,monospace;font-size:.9rem}
.pill{background:var(--warn-l);color:var(--ink);border:1px solid var(--warn);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.9rem}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 16px;font-weight:600;transition:transform .08s,box-shadow .15s,background .15s}
.btn:hover{box-shadow:var(--shadow)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-d)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.small{padding:5px 11px;font-size:.88rem;border-radius:9px}
main{max-width:980px;margin:0 auto;padding:22px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow);animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:1.9rem;line-height:1.2;margin:.2em 0 .3em}
h2{font-size:1.4rem;margin:.1em 0 .5em;line-height:1.25}
h3{margin:.2em 0}
p{margin:.55em 0}
.muted{color:var(--muted)}
/* home */
.hero{background:linear-gradient(135deg,var(--brand),#a14bdb);color:#fff;border-radius:22px;padding:28px 26px;box-shadow:var(--shadow)}
.hero h1{margin-top:0}
.hero p{opacity:.95;max-width:62ch}
.hero .name{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.hero input{border:0;border-radius:12px;padding:10px 14px;font:inherit;min-width:220px;color:#1f2437}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:20px}
.lvl{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .12s,box-shadow .15s,border-color .15s}
.lvl:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--brand)}
.lvl .ic{font-size:2rem}
.lvl .num{font-size:.78rem;font-weight:800;letter-spacing:.06em;color:var(--brand);text-transform:uppercase}
.lvl .t{font-weight:800;font-size:1.05rem}
.lvl .d{color:var(--muted);font-size:.92rem;flex:1}
.stars{font-size:1.15rem;letter-spacing:2px;color:var(--warn)}
.stars .off{opacity:.25}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* progress */
.prog{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#a14bdb);transition:width .3s}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin-bottom:6px;font-weight:600}
.kind{display:inline-block;background:var(--brand-l);color:var(--brand-d);font-weight:800;font-size:.75rem;letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border-radius:999px;margin-bottom:8px}
.foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.fb{margin-top:16px;border-radius:14px;padding:12px 16px;border:1px solid;animation:pop .2s}
.fb.ok{background:var(--ok-l);border-color:var(--ok)}
.fb.ko{background:var(--ko-l);border-color:var(--ko)}
.fb.info{background:var(--warn-l);border-color:var(--warn)}
.fb ul{margin:.3em 0 0;padding-left:1.2em}
/* code */
pre.code{margin:12px 0;background:var(--code-bg);color:var(--code-ink);border-radius:14px;padding:14px 16px;overflow:auto;font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;tab-size:2}
pre.code code{background:none;color:inherit;padding:0;font-size:inherit}
pre.code .t,.bl .t{color:var(--code-tag)} pre.code .a,.bl .a{color:var(--code-attr)} pre.code .s,.bl .s{color:var(--code-str)} pre.code .c,.bl .c{color:var(--code-com);font-style:italic}
.demo-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;margin:12px 0}
@media (max-width:760px){.demo-wrap{grid-template-columns:1fr}}
.demo-wrap pre.code{margin:0}
.demo{border:2px dashed var(--brand);border-radius:14px;padding:14px;background:var(--card);position:relative;font-family:"Times New Roman",serif}
.demo::before{content:"Resultado en el navegador";position:absolute;top:-11px;left:12px;background:var(--card);padding:0 8px;font:700 .72rem system-ui,sans-serif;color:var(--brand);letter-spacing:.04em;text-transform:uppercase}
.demo label{margin-right:4px}
.demo p{margin:.5em 0}
.demo textarea{vertical-align:top}
.demo fieldset{margin:6px 0}
table.t{border-collapse:collapse;width:100%;margin:12px 0;font-size:.95rem}
table.t th,table.t td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.t th{background:var(--brand-l);width:34%;font-weight:700}
.tip{background:var(--warn-l);border-left:5px solid var(--warn);padding:10px 14px;border-radius:10px;margin:12px 0}
/* quiz */
.opts{display:grid;gap:10px;margin-top:12px}
.opt{text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--brand)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--brand-l);color:var(--brand-d);display:grid;place-items:center;font-weight:800;font-size:.85rem}
.opt.sel{border-color:var(--brand);background:var(--brand-l)}
.opt.ok{border-color:var(--ok);background:var(--ok-l)}
.opt.ko{border-color:var(--ko);background:var(--ko-l);animation:shake .35s}
.opt.locked{pointer-events:none}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
/* match / sort */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px;margin-top:12px}
@media (max-width:620px){.cols{grid-template-columns:1fr 1fr;gap:10px}}
.chip{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;text-align:left;transition:all .12s;width:100%}
.chip:hover{border-color:var(--brand)}
.chip.sel{border-color:var(--brand);background:var(--brand-l)}
.chip.ok{border-color:var(--ok);background:var(--ok-l);pointer-events:none}
.chip.ko{border-color:var(--ko);background:var(--ko-l);animation:shake .35s}
.col{display:grid;gap:10px;align-content:start}
.sortrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:8px 10px;margin-top:10px}
.sortrow.ok{border-color:var(--ok);background:var(--ok-l)}
.sortrow.ko{animation:shake .35s;border-color:var(--ko)}
@media (max-width:560px){.sortrow{grid-template-columns:1fr 1fr}.sortrow>span{grid-column:1/-1}}
/* fill */
.fill{background:var(--code-bg);color:var(--code-ink);border-radius:14px;padding:14px 16px;font:14px/2.1 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;overflow:auto;margin:12px 0}
.fill input{font:inherit;background:#fff;color:#1f2437;border:2px solid var(--code-attr);border-radius:6px;padding:0 6px;margin:0 2px;text-align:center;outline:none}
.fill input:focus{box-shadow:0 0 0 3px rgba(255,212,121,.4)}
.fill input.ok{border-color:var(--ok);background:#d9f7e5}
.fill input.ko{border-color:var(--ko);background:#ffe0e5;animation:shake .35s}
/* order */
.ord{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
@media (max-width:760px){.ord{grid-template-columns:1fr}}
.zone{background:var(--bg);border:2px dashed var(--line);border-radius:14px;padding:10px;min-height:120px;display:grid;gap:6px;align-content:start}
.zone h4{margin:0 0 2px;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.ln{background:var(--code-bg);color:var(--code-ink);border:2px solid transparent;border-radius:10px;padding:6px 10px;text-align:left;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre;overflow:auto}
.ln:hover{border-color:var(--code-attr)}
.ln.ok{border-color:var(--ok)} .ln.ko{border-color:var(--ko)}
/* bugs */
.bugs{background:var(--code-bg);border-radius:14px;padding:8px;margin:12px 0;display:grid;gap:2px}
.bl{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;text-align:left;background:transparent;border:2px solid transparent;border-radius:8px;color:var(--code-ink);padding:3px 8px;font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;white-space:pre;overflow:auto}
.bl:hover{background:rgba(255,255,255,.07)}
.bl .n{color:var(--code-com);text-align:right}
.bl.sel{border-color:var(--warn);background:rgba(242,169,0,.18)}
.bl.ok{border-color:var(--ok);background:rgba(76,214,138,.18)}
.bl.ko{border-color:var(--ko);background:rgba(255,107,129,.2)}
/* lab */
.lab{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
@media (max-width:820px){.lab{grid-template-columns:1fr}}
textarea.ed{width:100%;min-height:340px;resize:vertical;background:var(--code-bg);color:var(--code-ink);border:0;border-radius:14px;padding:14px;font:13.5px/1.55 ui-monospace,Menlo,Consolas,monospace;tab-size:2}
iframe.pv{width:100%;min-height:340px;height:100%;border:2px dashed var(--brand);border-radius:14px;background:#fff}
.checks{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:6px}
.checks li{display:flex;gap:10px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.checks li.ok{background:var(--ok-l);border-color:var(--ok)}
.checks li.ko{background:var(--ko-l);border-color:var(--ko)}
/* cheat */
.cheat{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.cheat .card{padding:16px}
.cheat table.t th{width:44%}
/* result */
.res{text-align:center}
.res .big{font-size:4rem}
.res .stars{font-size:2.4rem}
.diploma{margin:22px auto 6px;max-width:620px;border:6px double var(--brand);border-radius:18px;padding:22px;text-align:center;background:var(--card)}
.diploma h2{color:var(--brand)}
.diploma .nm{font-size:1.7rem;font-weight:800;border-bottom:2px solid var(--line);display:inline-block;padding:0 22px 4px;margin:6px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:50;font-weight:600;animation:pop .2s}
.confetti{position:fixed;top:-30px;font-size:1.6rem;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
/* ===== gráficos y animaciones ===== */
.sky{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:linear-gradient(#dcebff,#f4f6fb 60%)}
@media (prefers-color-scheme: dark){.sky{background:linear-gradient(#1b1f40,#12141f 65%)}}
.sky .cl{position:absolute;opacity:.65;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-25vw)}to{transform:translateX(125vw)}}
.sky .pln{position:absolute;font-size:2.2rem;top:14%;left:0;animation:skyfly 22s linear infinite}
@keyframes skyfly{0%{transform:translate(-10vw,30px) rotate(-6deg)}50%{transform:translate(55vw,-24px) rotate(3deg)}100%{transform:translate(112vw,26px) rotate(-5deg)}}
.hero{position:relative;overflow:hidden}
.hero>*:not(.hero-art){position:relative;z-index:1}
.hero-art{position:absolute;right:0;bottom:0;width:min(48%,430px);z-index:0}
@media (max-width:700px){.hero-art{opacity:.3;width:85%}}
.hero-art .bal{animation:bob 5s ease-in-out infinite}
.hero-art .sun{animation:sunp 3s ease-in-out infinite;transform-origin:330px 62px}
@keyframes bob{50%{transform:translateY(-12px)}}
@keyframes sunp{50%{transform:scale(1.12)}}
@keyframes plfly{from{transform:translate(-50px,120px)}to{transform:translate(460px,30px)}}
.card{position:relative}
.card.shake{animation:shake .4s}
.lvl{animation:pop .45s both;animation-delay:calc(var(--i)*60ms)}
.lvl:hover .ic{animation:wiggle .5s}
@keyframes wiggle{25%{transform:rotate(-14deg) scale(1.2)}75%{transform:rotate(14deg) scale(1.2)}}
.pill.pop{animation:pill .5s}
.streak{background:#ffe3d1;border-color:#ff7a45}
@keyframes pill{40%{transform:scale(1.3)}}
/* ruta */
.route-scroll{overflow-x:auto;padding:6px 0 0;margin-top:18px}
.route{position:relative;height:116px;min-width:640px;margin:0 34px}
.route .rl{position:absolute;left:0;right:0;top:56px;border-top:5px dashed var(--line)}
.route .rf{position:absolute;left:0;top:56px;height:5px;background:linear-gradient(90deg,var(--ok),var(--brand));border-radius:9px}
.stop{position:absolute;top:34px;transform:translateX(-50%);width:50px;height:50px;border-radius:50%;border:3px solid var(--line);background:var(--card);font-size:1.4rem;display:grid;place-items:center;padding:0;transition:transform .15s}
.stop:hover{transform:translateX(-50%) scale(1.15)}
.stop.done{border-color:var(--ok);background:var(--ok-l)}
.stop.now{border-color:var(--brand);animation:ring 1.8s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(91,75,219,.55)}100%{box-shadow:0 0 0 16px rgba(91,75,219,0)}}
.stop .n{position:absolute;top:56px;font:700 .72rem system-ui,sans-serif;color:var(--muted);white-space:nowrap}
.rplane{position:absolute;top:-4px;transform:translateX(-50%);font-size:1.9rem;pointer-events:none}
/* mascota */
.foot{align-items:center;justify-content:space-between}
.mascot{display:flex;align-items:center;gap:6px;margin-right:auto;min-width:0;max-width:100%}
.mx{width:76px;height:auto;flex:none;overflow:visible}
.mx-body{transform-origin:60px 112px;animation:idle 3s ease-in-out infinite}
@keyframes idle{50%{transform:translateY(-4px) rotate(1.5deg)}}
.mx .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.mx .m{display:none}
.mx.idle .m-h,.mx.happy .m-h{display:inline}
.mx.sad .m-s{display:inline}.mx.think .m-t{display:inline}
.mx.sad .pp{transform:translateY(3px)}
.mx.think .pp{transform:translate(3px,-3px)}
.mx.sad .tear{display:inline}.mx .tear{display:none}
.mascot.jump .mx{animation:jump .6s}
.mascot.shk .mx{animation:shake .45s}
@keyframes jump{30%{transform:translateY(-22px) scale(1.06)}60%{transform:translateY(0) scaleY(.92)}}
.bubble{background:var(--brand-l);color:var(--ink);border-radius:14px;padding:6px 12px;font-size:.88rem;font-weight:600;max-width:260px;position:relative}
.bubble:empty{display:none}
.bubble::before{content:"";position:absolute;left:-7px;top:50%;margin-top:-7px;border:7px solid transparent;border-left:0;border-right-color:var(--brand-l)}
/* partículas */
.bp{position:fixed;z-index:80;pointer-events:none;font-size:1.3rem;animation:burst .9s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.4);opacity:0}}
.ft{position:fixed;z-index:80;pointer-events:none;font-weight:900;font-size:1.5rem;color:var(--ok);text-shadow:0 2px 0 rgba(0,0,0,.15);animation:rise 1.1s ease-out forwards}
@keyframes rise{from{transform:translateY(0) scale(.6);opacity:1}to{transform:translateY(-70px) scale(1.2);opacity:0}}
.banner{position:fixed;top:92px;left:0;z-index:70;background:var(--card);border:2px solid var(--brand);border-radius:999px;padding:8px 20px;font-weight:800;white-space:nowrap;box-shadow:var(--shadow);animation:bnr 4s linear forwards;pointer-events:none}
@keyframes bnr{from{transform:translateX(-110%)}to{transform:translateX(100vw)}}
.res .big{animation:trophy 1.2s ease-out}
@keyframes trophy{0%{transform:scale(0) rotate(-40deg)}60%{transform:scale(1.3) rotate(8deg)}100%{transform:none}}
.stars .spop{display:inline-block;animation:spop .6s both}
@keyframes spop{from{transform:scale(0) rotate(-200deg);opacity:0}70%{transform:scale(1.4) rotate(10deg)}to{transform:none;opacity:1}}
.chip.ok,.opt.ok,.sortrow.ok{animation:okpop .4s}
@keyframes okpop{40%{transform:scale(1.04)}}
/* ilustraciones de las lecciones */
.art{margin:14px 0;border:2px solid var(--line);border-radius:16px;padding:14px;background:linear-gradient(180deg,var(--brand-l),var(--card))}
.art .cap{font-size:.9rem;color:var(--muted);text-align:center;margin:8px 0 0}
.art .ttl{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);margin-bottom:6px}
pre.anat{margin:6px 0}
.part{cursor:pointer;border-radius:5px;padding:1px 3px;transition:all .25s}
.part.on{background:rgba(255,255,255,.18);box-shadow:0 0 0 2px var(--code-attr)}
.lane{display:grid;grid-template-columns:84px 1fr 38px;align-items:center;gap:8px;margin:6px 0;font-weight:700;font-size:.85rem}
.lane .road{position:relative;height:44px;background:repeating-linear-gradient(90deg,var(--line) 0 14px,transparent 14px 24px) center/100% 4px no-repeat}
.lane .srv{font-size:1.7rem}
.pk{position:absolute;top:5px;left:0;white-space:nowrap;padding:4px 10px;border-radius:99px;font:700 .78rem ui-monospace,monospace;animation:ride 4.5s ease-in-out infinite}
.pk.g{background:var(--warn-l);border:2px solid var(--warn)}
.pk.p{background:var(--ok-l);border:2px solid var(--ok);animation-delay:.3s}
@keyframes ride{0%{left:0;transform:translateX(0);opacity:0}8%{opacity:1}75%{opacity:1}100%{left:100%;transform:translateX(-100%);opacity:0}}
.flow{display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap}
.flow .st{display:flex;flex-direction:column;align-items:center;font-size:2rem;padding:8px 12px;border-radius:14px;animation:lit 6s infinite}
.flow .st:nth-of-type(2){animation-delay:1.5s}.flow .st:nth-of-type(3){animation-delay:3s}.flow .st:nth-of-type(4){animation-delay:4.5s}
.flow small{font:600 .72rem ui-monospace,monospace;color:var(--muted);text-align:center}
.flow i{font-style:normal;font-weight:900;color:var(--brand);font-size:1.4rem;animation:nudge 1s infinite}
@keyframes nudge{50%{transform:translateX(5px)}}
@keyframes lit{0%,24%{transform:scale(1.15);background:var(--warn-l);box-shadow:0 0 0 3px var(--warn)}30%,100%{transform:none;background:transparent;box-shadow:none}}
.lf{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.lf-box{background:var(--card);border:2px solid var(--brand);border-radius:12px;padding:10px 14px;font:600 .88rem ui-monospace,monospace}
.lf-box small{display:block;color:var(--muted)}
.lf-box .fld{display:block;margin-top:6px;font:1rem "Times New Roman",serif;border:1px solid #888;padding:2px 8px;min-width:150px;border-radius:3px;background:#fff;color:#222}
.gl{animation:glow 1.6s infinite;border-radius:4px;padding:0 3px}

/* ============ utilidades ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const md=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
function el(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const k in (attrs||{})){
    const v=attrs[k];
    if(k==='class')e.className=v; else if(k==='html')e.innerHTML=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(v!==false&&v!=null)e.setAttribute(k,v===true?'':v);
  }
  kids.flat().forEach(c=>{if(c!=null)e.append(c.nodeType?c:document.createTextNode(c))});
  return e;
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function highlight(src){
  let h=esc(src);
  h=h.replace(/(&lt;!--[\s\S]*?--&gt;)/g,'<span class="c">$1</span>');
  h=h.replace(/(&lt;\/?)([a-zA-Z0-9]+)((?:\s+[^&<>]*?(?:"[^"]*"|[^&<>]*?))*?)(\/?&gt;)/g,(m,a,t,rest,z)=>{
    rest=rest.replace(/([\w-]+)(=)("[^"]*")?/g,(mm,n,eq,v)=>`<span class="a">${n}</span>${eq}${v?`<span class="s">${v}</span>`:''}`);
    rest=rest.replace(/(^|\s)(required|checked|selected|disabled|readonly|autofocus|multiple|novalidate)(?=\s|$)/g,'$1<span class="a">$2</span>');
    return `<span class="t">${a}${t}</span>${rest}<span class="t">${z}</span>`;
  });
  return h;
}
const codeBlock=src=>el('pre',{class:'code',html:`<code>${highlight(src)}</code>`});
function toast(msg){const t=el('div',{class:'toast'},msg);document.body.append(t);setTimeout(()=>t.remove(),1800)}
function confetti(n=40){
  const em=['🎉','⭐','✨','🧳','🌴','🎈'];
  for(let i=0;i<n;i++){
    const c=el('span',{class:'confetti'},em[i%em.length]);
    c.style.left=Math.random()*100+'vw';c.style.animationDuration=(1.8+Math.random()*2)+'s';c.style.animationDelay=Math.random()*.6+'s';
    document.body.append(c);setTimeout(()=>c.remove(),4800);
  }
}


/* ============ sonido, partículas, racha, mascota ============ */
const pick=a=>a[Math.floor(Math.random()*a.length)];
let snd=true;try{snd=localStorage.getItem('fq-snd')!=='0'}catch(e){}
let ac=null;
function tone(f,d,type,when,vol){
  if(!snd)return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ac=ac||new AC();
    const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+(when||0),v=vol||.07;
    o.type=type||'sine';o.frequency.value=f;o.connect(g);g.connect(ac.destination);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d);
  }catch(e){}
}
const SFX={
  ok:()=>{tone(660,.12);tone(880,.2,'sine',.1)},
  ko:()=>{tone(220,.25,'sawtooth',0,.04);tone(160,.3,'sawtooth',.12,.04)},
  win:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.25,'triangle',i*.12)),
  tap:()=>tone(520,.05,'square',0,.025)
};
function burst(x,y,n){
  const em=['✨','⭐','🎉','🧳','🌴','💜'];
  for(let i=0;i<(n||14);i++){
    const b=el('span',{class:'bp'},em[i%em.length]),a=Math.random()*Math.PI*2,d=60+Math.random()*90;
    b.style.left=x+'px';b.style.top=y+'px';
    b.style.setProperty('--dx',Math.cos(a)*d+'px');b.style.setProperty('--dy',Math.sin(a)*d-30+'px');b.style.setProperty('--r',(Math.random()*360-180)+'deg');
    document.body.append(b);setTimeout(()=>b.remove(),1000);
  }
}

function startLevel(i){cur={l:i,i:0,pts:0};setStreak(0);renderStep()}

function renderStep(){
  const L=LEVELS[cur.l],s=L.steps[cur.i];
  const pct=Math.round(cur.i/L.steps.length*100);
  const card=el('section',{class:'card'});
  const body=el('div'),foot=el('div',{class:'foot'}),fbBox=el('div'),extra=el('span',{class:'row'}),prim=el('span'),mas=makeMascot();
  foot.append(mas.el,el('span',{class:'row',style:'margin-left:auto'},extra,prim));
  card.append(
    el('div',{class:'meta'},el('span',{},`${L.icon} Nivel ${cur.l+1} · ${L.title}`),el('span',{},`Pantalla ${cur.i+1} de ${L.steps.length} · ${cur.pts} pts`)),
    el('div',{class:'prog'},el('i',{style:`width:${pct}%`})),
    body,fbBox,foot);
  const api={
    body,
    setBtn(label,fn,disabled){
      prim.innerHTML='';
      const b=el('button',{class:'btn primary',onclick:fn,disabled:!!disabled},label);prim.append(b);return b;
    },
    addBtn(label,fn){const b=el('button',{class:'btn',onclick:fn},label);extra.append(b);return b},
    fb(kind,html){
      fbBox.innerHTML='';if(html)fbBox.append(el('div',{class:'fb '+kind,html}));
      if(kind==='ko')api.oops(true);
      else if(kind==='ok'){SFX.ok();mas.say('happy',pick(MSG.ok),true);card.classList.remove('good')}
      else if(kind==='info'&&html)mas.say('think','Mmm… ¡mira la pista! 💡');
    },
    oops(quiet){
      SFX.ko();setStreak(0);mas.say('sad',pick(MSG.ko));
      card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');
    },
    award(p){cur.pts+=p},
    complete(attempts,revealed,custom){
      const p=revealed?0:(custom!=null?custom:(attempts<=1?10:attempts===2?6:3));
      cur.pts+=p;
      if(!revealed&&attempts<=1)setStreak(streak+1);else if(revealed)setStreak(0);
      const r=fbBox.getBoundingClientRect(),cx=r.left+Math.min(r.width,400)/2,cy=Math.max(80,Math.min(r.top,innerHeight-60));
      if(p>=6)burst(cx,cy);
      if(p>0)floatText(cx-20,cy,'+'+p+(streak>=3?' 🔥':''));
      if(streak>=3&&!revealed&&attempts<=1)mas.say('happy',MSG.streak.replace('{n}',streak),true);
      $('.meta span:last-child',card).textContent=`Pantalla ${cur.i+1} de ${L.steps.length} · ${cur.pts} pts`;
      extra.innerHTML='';
      api.setBtn(cur.i===L.steps.length-1?'Ver resultado →':'Continuar →',nextStep);
    }
  };
  view(card);
  mas.say(s.t==='learn'?'happy':'think',pick(MSG.start[s.t]));
  if(s.t!=='learn') body.append(el('span',{class:'kind'},KIND[s.t]));
  R[s.t](s,api);
}
function nextStep(){cur.i++;cur.i>=LEVELS[cur.l].steps.length?finishLevel():renderStep()}
const KIND={quiz:'Pregunta',match:'Emparejar',sort:'Clasificar',fill:'Completa el código',order:'Ordena el código',bugs:'Caza-errores',lab:'Laboratorio'};

function finishLevel(){
  const L=LEVELS[cur.l],max=levelMax(L),st=starsFor(cur.pts,max);
  save.best[L.id]=Math.max(save.best[L.id]||0,cur.pts);persist();updXP();
  SFX.win();if(st>=2)confetti();
  const msg=st===3?'¡Perfecto! Dominas este tema.':st===2?'¡Muy bien! Repasa los fallos si quieres las 3 estrellas.':'Has avanzado, pero conviene repetir el nivel.';
  const allDone=LEVELS.every(l=>save.best[l.id]>0);
  const card=el('section',{class:'card res'},
    el('div',{class:'big'},L.icon),
    el('h2',{},`Nivel ${cur.l+1} completado`),
    el('div',{html:starsHtml(st,true)}),
    el('p',{},`${cur.pts} / ${max} puntos`),
    el('p',{class:'muted'},msg),
    el('div',{class:'row',style:'justify-content:center;margin-top:14px'},
      el('button',{class:'btn',onclick:()=>startLevel(cur.l)},'↻ Repetir'),
      el('button',{class:'btn',onclick:renderHome},'🏠 Inicio'),
      cur.l<LEVELS.length-1?el('button',{class:'btn primary',onclick:()=>startLevel(cur.l+1)},'Siguiente nivel →'):null));
  if(allDone){card.append(diploma());confetti(70)}
  view(card);
}

R.quiz=(s,api)=>{
  const b=api.body;
  b.append(el('h2',{html:md(s.q)}));
  const order=s.fixed?s.options.map((_,i)=>i):shuffle(s.options.map((_,i)=>i));
  const ans=new Set(s.multi?s.answer:[s.answer]);
  const sel=new Set();let attempts=0,finished=false;
  const box=el('div',{class:'opts'});b.append(box);
  if(s.multi)b.append(el('p',{class:'muted',style:'margin:8px 0 0;font-size:.9rem'},'Puedes marcar varias respuestas.'));
  const btns={};
  order.forEach((oi,pos)=>{
    const btn=el('button',{class:'opt',onclick:()=>{
      if(finished)return;
      btn.classList.remove('ko');
      if(s.multi){sel.has(oi)?sel.delete(oi):sel.add(oi)}else{sel.clear();sel.add(oi)}
      Object.entries(btns).forEach(([k,v])=>v.classList.toggle('sel',sel.has(+k)));
      check.disabled=sel.size===0;
    }},el('span',{class:'k'},K[pos]),el('span',{html:md(s.options[oi])}));
    btns[oi]=btn;box.append(btn);
  });
  const check=api.setBtn('Comprobar',()=>{
    attempts++;
    const ok=sel.size===ans.size&&[...sel].every(x=>ans.has(x));
    if(ok){
      finished=true;
      Object.values(btns).forEach(x=>{x.classList.remove('sel');x.classList.add('locked')});
      ans.forEach(a=>btns[a].classList.add('ok'));
      api.fb('ok','✅ <strong>¡Correcto!</strong> '+md(s.why));
      api.complete(attempts,false);
    }else if(attempts>=2){
      finished=true;
      Object.entries(btns).forEach(([k,x])=>{x.classList.remove('sel');x.classList.add('locked');if(ans.has(+k))x.classList.add('ok')});
      api.fb('ko','❌ No era esa. La respuesta correcta está marcada en verde. '+md(s.why));
      api.complete(attempts,true);
    }else{
      sel.forEach(x=>{btns[x].classList.remove('sel');btns[x].classList.add('ko')});sel.clear();
      api.fb('ko','❌ Casi… inténtalo otra vez. '+(s.hint?'💡 '+md(s.hint):''));
      check.disabled=true;
    }
  },true);
};

R.fill=(s,api)=>{
  const b=api.body;b.append(el('h2',{html:md(s.q)}));

  const inputs={};let attempts=0,hinted=false;

    if(!m){box.append(document.createTextNode(part));return}
    const n=+m[1],w=Math.max(...s.answers[n].map(a=>a.length))+2;
    const inp=el('input',{type:'text',size:w,autocomplete:'off',autocapitalize:'off',spellcheck:'false','aria-label':'Hueco '+(n+1)});
    inp.addEventListener('input',()=>{(inputs[n]||[]).forEach(o=>{if(o!==inp)o.value=inp.value;o.classList.remove('ok','ko')});btn.disabled=Object.values(inputs).some(a=>!a[0].value.trim())});
    (inputs[n]=inputs[n]||[]).push(inp);box.append(inp);
  });
  api.addBtn('💡 Pista',()=>{hinted=true;Object.entries(inputs).forEach(([n,a])=>a.forEach(i=>i.placeholder=s.answers[n][0][0]+'…'));api.fb('info','💡 Cada hueco empieza por la letra que ves en gris.')});
  const btn=api.setBtn('Comprobar',()=>{
    attempts++;let all=true;

      if(!ok)all=false;
    });
    if(all){
      api.fb('ok','✅ <strong>¡Perfecto!</strong> El código está completo.');
      Object.values(inputs).flat().forEach(i=>i.disabled=true);
      api.complete(attempts,false);
    }else if(attempts>=3){
      Object.entries(inputs).forEach(([n,a])=>a.forEach(i=>{i.value=s.answers[n][0];i.disabled=true;i.classList.remove('ko');i.classList.add('ok')}));
      api.fb('ko','❌ Te enseño la solución para que la estudies. Fíjate bien en cada hueco.');
      api.complete(attempts,true);
    }else api.fb('ko','❌ Algún hueco no es correcto (en rojo). Revisa y vuelve a intentarlo. Intento '+attempts+' de 3.');
  },true);
};

    zP.innerHTML='';zA.innerHTML='';
    zP.append(el('h4',{},'Líneas desordenadas'));zA.append(el('h4',{},'Tu formulario'));
    pool.forEach(i=>zP.append(el('button',{class:'ln',onclick:()=>{if(finished)return;pool=pool.filter(x=>x!==i);placed.push(i);api.fb('');draw()}},s.lines[i])));
    placed.forEach((i,pos)=>zA.append(el('button',{class:'ln'+(marks?(i===pos?' ok':' ko'):''),onclick:()=>{if(finished)return;placed=placed.filter(x=>x!==i);pool.push(i);api.fb('');draw()}},s.lines[i])));
    btn.disabled=pool.length>0||finished;
  };
  const btn=api.setBtn('Comprobar',()=>{
    attempts++;
    const ok=placed.every((v,i)=>v===i);
    if(ok){finished=true;draw(true);api.fb('ok','✅ <strong>¡Orden perfecto!</strong> Observa cómo cada etiqueta de apertura tiene su cierre y cómo se anidan.');api.complete(attempts,false)}
    else if(attempts>=3){finished=true;placed=s.lines.map((_,i)=>i);pool=[];draw(true);api.fb('ko','❌ Esta es la solución correcta. Estúdiala: ¡la estructura importa!');api.complete(attempts,true)}
    else{draw(true);api.fb('ko',`❌ Hay líneas fuera de sitio (en rojo). Haz clic en ellas para recolocarlas. Intento ${attempts} de 3.`)}
  },true);
  draw();
};

R.bugs=(s,api)=>{
  const b=api.body;b.append(el('h2',{html:md(s.q)}),el('p',{class:'muted',style:'margin:0'},'Haz clic en cada línea que creas que tiene un error (otra vez para quitar la marca).'));
  const lines=s.lines.map(l=>typeof l==='string'?{t:l,bug:null}:{t:l[0],bug:l[1]});
  const total=lines.filter(l=>l.bug).length;
  const sel=new Set();let attempts=0,finished=false;const box=el('div',{class:'bugs'});b.append(box);
  const rows=lines.map((l,i)=>{
    const r=el('button',{class:'bl',onclick:()=>{
      if(finished)return;r.classList.remove('ko');sel.has(i)?sel.delete(i):sel.add(i);r.classList.toggle('sel',sel.has(i));btn.disabled=sel.size===0;
    }},el('span',{class:'n'},String(i+1)),el('span',{html:highlight(l.t)}));
    box.append(r);return r;
  });
  const explain=()=>'<ul>'+lines.map((l,i)=>l.bug?`<li><strong>Línea ${i+1}:</strong> ${md(l.bug)}</li>`:'').join('')+'</ul>';
  const btn=api.setBtn('Comprobar',()=>{
    attempts++;
    const hits=lines.filter((l,i)=>l.bug&&sel.has(i)).length,wrong=[...sel].filter(i=>!lines[i].bug).length;
    if(hits===total&&wrong===0){
      finished=true;rows.forEach((r,i)=>{r.classList.remove('sel');if(lines[i].bug)r.classList.add('ok')});
      api.fb('ok','✅ <strong>¡Todos los errores encontrados!</strong>'+explain());api.complete(attempts,false);
    }else if(attempts>=3){
      finished=true;rows.forEach((r,i)=>{r.classList.remove('sel');if(lines[i].bug)r.classList.add('ok');else if(sel.has(i))r.classList.add('ko')});
      api.fb('ko','❌ Estos eran los errores:'+explain());api.complete(attempts,true);
    }else{
      rows.forEach((r,i)=>{if(sel.has(i)&&!lines[i].bug){r.classList.remove('sel');r.classList.add('ko');sel.delete(i)}});
      api.fb('ko',`❌ Has encontrado ${hits} de ${total} errores y ${wrong} línea${wrong===1?'':'s'} marcada${wrong===1?'':'s'} estaba${wrong===1?'':'n'} bien (las quito). Sigue buscando. Intento ${attempts} de 3.`);
    }
  },true);
};

 ['`<form>` con `action` y `method="post"`',d=>{const f=d.querySelector('form');return !!f&&!!f.getAttribute('action')&&(f.getAttribute('method')||'').toLowerCase()==='post'}],
 ['Un `<select>` con `name`, `required` y al menos 2 `<option>`',d=>{const s=d.querySelector('select[name]');return !!s&&s.hasAttribute('required')&&s.querySelectorAll('option').length>=2}],
 ['Un `input type="date"` con `name`',d=>!!d.querySelector('input[type=date][name]')],
 ['Un `input type="email"` con `name` y `required`',d=>!!d.querySelector('input[type=email][name][required]')],
 ['Dos o más `input type="radio"` con el **mismo** `name`',d=>{const m={};d.querySelectorAll('input[type=radio][name]').forEach(r=>m[r.name]=(m[r.name]||0)+1);return Object.values(m).some(n=>n>=2)}],
 ['Al menos un `input type="checkbox"` con `name`',d=>!!d.querySelector('input[type=checkbox][name]')],
 ['Un `<textarea>` con `name`',d=>!!d.querySelector('textarea[name]')],
 ['Todos los `<label>` tienen `for` que apunta a un `id` existente',d=>{const ls=[...d.querySelectorAll('label')];return ls.length>0&&ls.every(l=>l.getAttribute('for')&&d.getElementById(l.getAttribute('for')))}],
 ['Un botón de enviar (`submit`) y otro de limpiar (`reset`)',d=>!!d.querySelector('[type=submit],button:not([type])')&&!!d.querySelector('[type=reset]')],
];

R.lab=(s,api)=>{
  const b=api.body;b.append(el('h2',{html:md(s.q)}));
  const ta=el('textarea',{class:'ed',spellcheck:'false','aria-label':'Editor de código'});ta.value=LAB_START;
  const pv=el('iframe',{class:'pv',sandbox:'',title:'Vista previa'});
  const upd=()=>{pv.srcdoc=`<!doctype html><meta charset="utf-8"><body style="font-family:'Times New Roman',serif;padding:10px">${ta.value}`};
  let t;ta.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(upd,250)});
  ta.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();const p=ta.selectionStart;ta.setRangeText('  ',p,ta.selectionEnd,'end')}});
  b.append(el('div',{class:'lab'},ta,pv));
  const list=el('ul',{class:'checks'});b.append(el('h3',{style:'margin-top:16px'},'Requisitos'),list);
  const items=LAB_CHECKS.map(([txt])=>{const li=el('li',{},el('span',{},'⬜'),el('span',{html:md(txt)}));list.append(li);return li});
  let best=0,extraAdded=false;
  api.addBtn('👀 Ver solución de ejemplo',()=>{if(confirm('Esto reemplazará tu código por un ejemplo. ¿Seguro?')){ta.value=LAB_SOLUTION;upd()}});
  const finish=()=>api.complete(1,false,Math.round(10*best/LAB_CHECKS.length));
  api.setBtn('Comprobar',()=>{
    const d=new DOMParser().parseFromString(ta.value,'text/html');
    let n=0;
    LAB_CHECKS.forEach(([,fn],i)=>{let ok=false;try{ok=!!fn(d)}catch(e){}
      items[i].className=ok?'ok':'ko';items[i].firstChild.textContent=ok?'✅':'❌';if(ok)n++});
    best=Math.max(best,n);
    if(n===LAB_CHECKS.length){api.fb('ok','🎉 <strong>¡Todos los requisitos cumplidos!</strong> Ya puedes afrontar la práctica completa.');confetti(50);finish()}
    else{api.fb('info',`Llevas ${n} de ${LAB_CHECKS.length} requisitos. Corrige los marcados con ❌ y vuelve a comprobar.`);
      if(!extraAdded){extraAdded=true;api.addBtn('Terminar así →',finish)}}
  });
  upd();
};
